# kdl-rbac.yaml — least-privilege read-only access for Kasten Discovery Lite (KDL)
#
# KDL is a read-only discovery tool. It never creates, updates or deletes
# anything. This manifest grants exactly the GET/LIST access KDL needs and
# nothing more, so it can be handed to a restricted (e.g. K10-admin-only)
# kubeconfig without over-provisioning.
#
# ============================================================================
# TWO-PART / TWO-PERSONA MODEL — READ THIS BEFORE APPLYING
# ============================================================================
# This file bundles TWO independent RBAC scopes because, in practice, they
# are usually applied by two different people:
#
#   PART A — cluster-scoped   (ClusterRole + ClusterRoleBinding, both named
#                              "kasten-discovery-reader")
#     - Grants cluster-wide read access KDL needs: namespaces, PVCs across
#       ALL namespaces, nodes, storageclasses, volumesnapshotclasses, CRDs,
#       etc. Does NOT grant read access to cluster RBAC objects
#       (ClusterRoles/ClusterRoleBindings) — that's an optional add-on (see
#       README.md "Cluster-scoped — optional, for full RBAC inventory");
#       without it the K10 RBAC-inventory section is best-effort and may
#       show as "not assessed".
#     - Creating cluster-scoped objects requires CLUSTER-ADMIN (or an
#       equivalent cluster-scoped role that can create ClusterRole/
#       ClusterRoleBinding). Apply this part ONCE, cluster-wide.
#     - A K10-admin (namespace-scoped admin on kasten-io, NOT cluster-admin)
#       CANNOT apply this part. `oc apply`/`kubectl apply` will fail on these
#       two objects with:
#         Error from server (Forbidden): ... is forbidden: User cannot
#         create resource "clusterroles" ... at the cluster scope
#       This is EXPECTED, not a bug in KDL or in this manifest — ask a
#       cluster-admin to apply Part A.
#
#   PART B — namespaced        (Role + RoleBinding, both named
#                              "kasten-discovery-reader-ns", in kasten-io)
#     - Grants the sensitive namespaced reads (Secrets, ConfigMaps) scoped
#       to the K10 namespace ONLY.
#     - Can be applied by ANYONE with admin rights on the K10 namespace,
#       e.g. a K10-admin who is not cluster-admin.
#
# If you only have K10-admin and `oc apply -f kdl-rbac.yaml` reports the
# Forbidden error above for the ClusterRole/ClusterRoleBinding: that is
# fine — Part B still applies successfully. KDL still runs; the
# cluster-scoped sections of its report will simply be left EMPTY /
# marked "not assessed" (not zero) until a cluster-admin applies Part A.
# See README.md "RBAC Requirements" for the full explanation and commands.
# ============================================================================
#
# Usage:
#   1. Edit the two *Binding* objects at the bottom to point at your principal
#      (ServiceAccount, User or Group) and the K10 namespace (default kasten-io).
#   2. kubectl apply -f kdl-rbac.yaml   (or: oc apply -f kdl-rbac.yaml)
#      - Cluster-admin: applies both Part A and Part B in one shot.
#      - K10-admin only: Part B applies; Part A objects are rejected with the
#        Forbidden error above — expected, safe to ignore, or hand this file
#        to a cluster-admin to apply Part A separately.
#
# Notes:
#   - The namespaced Role covers `secrets` (k10-license, Helm release secret).
#     If you run KDL with `--no-helm` and do not need license details, you may
#     drop the `secrets` resource from the Role.
#   - Some resources are optional and only read on the matching platform
#     (OpenShift routes/scc, KubeVirt/Harvester virtualization, Kanister
#     blueprints). They are harmless to grant on clusters that lack the CRDs.
---
# ============================================================================
# PART A — CLUSTER-SCOPED (apply ONCE, by a CLUSTER-ADMIN)
# A K10-admin cannot create these two objects — see header note above.
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kasten-discovery-reader
  labels:
    app.kubernetes.io/name: kasten-discovery-lite
    app.kubernetes.io/component: rbac
rules:
  # --- Core cluster-scoped + cross-namespace inventory ---
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list"]

  # --- Workloads (K10 deployments, replicas) ---
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list"]

  # --- Networking (NetworkPolicies, Ingress) ---
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list"]

  # --- Storage (StorageClasses, VolumeSnapshot* ) ---
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshotclasses
      - volumesnapshots
      - volumesnapshotcontents
    verbs: ["get", "list"]

  # --- CRD + webhook discovery ---
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
    verbs: ["get", "list"]

  # --- Kasten K10 custom resources (read-only) ---
  - apiGroups: ["config.kio.kasten.io"]
    resources:
      - profiles
      - policies
      - policypresets
      - transformsets
      - blueprintbindings
    verbs: ["get", "list"]
  - apiGroups: ["actions.kio.kasten.io"]
    resources:
      - backupactions
      - exportactions
      - restoreactions
      - runactions
      - reportactions
    verbs: ["get", "list"]
  - apiGroups: ["apps.kio.kasten.io"]
    resources:
      - restorepoints
    verbs: ["get", "list"]
  - apiGroups: ["reporting.kio.kasten.io"]
    resources:
      - reports
    verbs: ["get", "list"]
  - apiGroups: ["dist.kio.kasten.io"]
    resources:
      - clusters
    verbs: ["get", "list"]
  - apiGroups: ["cr.kanister.io"]
    resources:
      - blueprints
    verbs: ["get", "list"]

  # --- OpenShift (optional; harmless if CRDs absent) ---
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list"]
  - apiGroups: ["security.openshift.io"]
    resources:
      - securitycontextconstraints
    verbs: ["get", "list"]
  - apiGroups: ["operators.coreos.com"]
    resources:
      - clusterserviceversions
    verbs: ["get", "list"]

  # --- Virtualization (optional: KubeVirt / OpenShift Virt / Harvester) ---
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - kubevirts
    verbs: ["get", "list"]
  - apiGroups: ["harvesterhci.io"]
    resources:
      - settings
    verbs: ["get", "list"]
---
# ============================================================================
# PART B — NAMESPACED (apply by anyone with admin on the K10 namespace,
# e.g. a K10-admin who is NOT cluster-admin)
# Sensitive reads, scoped to the K10 namespace ONLY (not cluster-wide).
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kasten-discovery-reader-ns
  namespace: kasten-io          # <-- change if your K10 namespace differs
  labels:
    app.kubernetes.io/name: kasten-discovery-lite
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources:
      - secrets        # k10-license + Helm release secret; drop if using --no-helm
      - configmaps     # k10-config fallback
    verbs: ["get", "list"]
---
# ---------------------------------------------------------------------------
# Bindings — EDIT the subjects to match your principal before applying.
# Examples below bind a ServiceAccount named "kdl" in namespace "kasten-io".
# ---------------------------------------------------------------------------
# --- PART A binding (cluster-scoped — CLUSTER-ADMIN only) ------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kasten-discovery-reader
  labels:
    app.kubernetes.io/name: kasten-discovery-lite
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kasten-discovery-reader
subjects:
  - kind: ServiceAccount
    name: kdl
    namespace: kasten-io
  # - kind: User
  #   name: alice@example.com
  #   apiGroup: rbac.authorization.k8s.io
---
# --- PART B binding (namespaced — K10-admin or any namespace admin) --------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kasten-discovery-reader-ns
  namespace: kasten-io          # <-- must match the Role namespace above
  labels:
    app.kubernetes.io/name: kasten-discovery-lite
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kasten-discovery-reader-ns
subjects:
  - kind: ServiceAccount
    name: kdl
    namespace: kasten-io
